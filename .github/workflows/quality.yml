name: Tests and SonarQube
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.3']
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, openssl, zip
          tools: composer:v2
          coverage: ${{ matrix.php == '8.2' && 'xdebug' || 'none' }}
      - run: composer install --no-interaction --prefer-dist
      - run: composer validate --strict
      - name: Audit shipped Composer packages
        if: matrix.php == '8.2'
        run: composer audit --locked --no-dev
      - run: find . -path ./vendor -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: composer cs
      - run: composer analyse
      - name: OIDC Mozart artifact and collision checks
        run: composer test:oidc-spike
      - run: composer test
        if: matrix.php != '8.2'
      - name: Unit coverage against source
        if: matrix.php == '8.2'
        env:
          XDEBUG_MODE: coverage
        run: composer test:coverage
      - uses: actions/upload-artifact@v7
        if: matrix.php == '8.2'
        with:
          name: php-unit-coverage
          path: coverage/unit.xml
          if-no-files-found: error
          retention-days: 14

  wordpress:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - php: '8.2'
            wordpress: '6.7'
            database: 'mysql:8.0'
          - php: '8.3'
            wordpress: 'latest'
            database: 'mariadb:11.4'
    services:
      database:
        image: ${{ matrix.database }}
        env:
          MYSQL_ROOT_HOST: "%"
          MYSQL_ROOT_PASSWORD: swsl-test-root
          MYSQL_DATABASE: swsl_m0_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pswsl-test-root || mariadb-admin ping -h localhost -pswsl-test-root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      SWSL_TEST_WORDPRESS: /tmp/swsl-ci-wordpress
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, zip
          tools: composer:v2, wp-cli
          coverage: ${{ matrix.php == '8.2' && 'xdebug' || 'none' }}
      - run: composer install --no-interaction --prefer-dist
      - run: composer test:mozart
      - run: composer build:release
      - name: Install disposable WordPress
        run: |
          wp core download --path="$SWSL_TEST_WORDPRESS" --version="${{ matrix.wordpress }}"
          wp config create --path="$SWSL_TEST_WORDPRESS" --dbname=swsl_m0_test --dbuser=root --dbpass=swsl-test-root --dbhost=127.0.0.1:3306 --dbprefix=swsltest_
          wp core install --path="$SWSL_TEST_WORDPRESS" --url=http://swsl.test --title='Securelogin integration' --admin_user=swsl-test-admin --admin_password=swsl-disposable-test-password --admin_email=test@example.org --skip-email
          ln -s "$GITHUB_WORKSPACE" "$SWSL_TEST_WORDPRESS/wp-content/plugins/sw-securelogin"
          wp plugin activate sw-securelogin --path="$SWSL_TEST_WORDPRESS"
      - name: WordPress coverage against original source
        if: matrix.php == '8.2'
        env:
          XDEBUG_MODE: coverage
          SWSL_EXPECT_PLUGIN_ROOT: ${{ github.workspace }}
        run: composer test:integration:coverage
      - uses: actions/upload-artifact@v7
        if: matrix.php == '8.2'
        with:
          name: php-wordpress-coverage
          path: coverage/wordpress.xml
          if-no-files-found: error
          retention-days: 14
      - name: Install the final ZIP in the disposable site
        run: |
          wp plugin deactivate sw-securelogin --path="$SWSL_TEST_WORDPRESS"
          unlink "$SWSL_TEST_WORDPRESS/wp-content/plugins/sw-securelogin"
          wp plugin install "$GITHUB_WORKSPACE/build/"*.zip --activate --path="$SWSL_TEST_WORDPRESS"
      - uses: actions/upload-artifact@v7
        with:
          name: release-candidate-php-${{ matrix.php }}
          path: |
            build/*.zip
            build/*.zip.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Test isolated WordPress build
        env:
          XDEBUG_MODE: 'off'
          SWSL_EXPECT_PLUGIN_ROOT: /tmp/swsl-ci-wordpress/wp-content/plugins/sw-securelogin
        run: composer test:integration
      - name: Check the installed ZIP with Plugin Check
        run: |
          wp plugin install plugin-check --version=2.1.0 --activate --path="$SWSL_TEST_WORDPRESS"
          wp --require="$SWSL_TEST_WORDPRESS/wp-content/plugins/plugin-check/cli.php" plugin check sw-securelogin --format=strict-json --path="$SWSL_TEST_WORDPRESS" > build/plugin-check.json
          cat build/plugin-check.json
          php -r '$items = json_decode(file_get_contents("build/plugin-check.json"), true, 512, JSON_THROW_ON_ERROR); if (!is_array($items)) exit(1); foreach ($items as $item) { if ($item["type"] === "ERROR") exit(1); }'
          wp plugin deactivate plugin-check --path="$SWSL_TEST_WORDPRESS"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: plugin-check-php-${{ matrix.php }}
          path: build/plugin-check.json
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Audit shipped npm packages
        if: matrix.php == '8.2'
        run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run test:coverage-tools
      - run: npx playwright-core install --with-deps chromium
      - run: npm run test:e2e
      - name: Test WP Armour and a renamed login URL
        run: |
          wp plugin install honeypot --version=2.4.02 --activate --path="$SWSL_TEST_WORDPRESS"
          wp plugin install wps-hide-login --version=1.9.19 --activate --path="$SWSL_TEST_WORDPRESS"
          wp option update whl_page swsl-test-login --path="$SWSL_TEST_WORDPRESS"
          SWSL_TEST_LOGIN_PATH=/swsl-test-login npm run test:e2e
          wp plugin deactivate honeypot wps-hide-login --path="$SWSL_TEST_WORDPRESS"
      - name: Reject an unreviewed real MFA plugin
        run: |
          wp plugin install two-factor --version=0.14.2 --path="$SWSL_TEST_WORDPRESS"
          php tests/Compatibility/mfa.php
      - name: Verify the unsupported multisite boundary
        run: |
          wp core multisite-convert --title='Unsupported test network' --base=/ --path="$SWSL_TEST_WORDPRESS"
          php tests/Compatibility/multisite.php
      - uses: actions/upload-artifact@v7
        if: matrix.php == '8.2'
        with:
          name: js-coverage
          path: coverage/js/lcov.info
          if-no-files-found: error
          retention-days: 14

  coverage:
    name: PHP coverage gate
    needs: [php, wordpress]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: dom
          coverage: none
      - uses: actions/download-artifact@v8
        with:
          name: php-unit-coverage
          path: coverage
      - uses: actions/download-artifact@v8
        with:
          name: php-wordpress-coverage
          path: coverage
      - name: Merge and normalize original-source coverage
        run: php tests/coverage/merge.php coverage/clover.xml coverage/unit.xml coverage/wordpress.xml
      - name: Enforce PHP line coverage above 80 percent
        run: php tests/coverage/check.php coverage/clover.xml
      - uses: actions/upload-artifact@v7
        with:
          name: php-coverage
          path: coverage/clover.xml
          if-no-files-found: error
          retention-days: 14

  sonarqube:
    name: SonarQube Cloud
    needs: [coverage]
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.user.login != 'dependabot[bot]') ||
      ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
       github.ref_name == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: dom
          coverage: none
      - uses: actions/download-artifact@v8
        with:
          name: php-coverage
          path: coverage
      - uses: actions/download-artifact@v8
        with:
          name: js-coverage
          path: coverage/js
      - name: Check SonarQube configuration
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo '::error::Set the SONAR_TOKEN repository secret for SonarQube Cloud.'
            exit 1
          fi
          if [ -z "$SONAR_ORGANIZATION" ]; then
            echo '::error::Set the SONAR_ORGANIZATION repository variable.'
            exit 1
          fi
          test -s coverage/clover.xml
      - name: Analyze code, import coverage and check quality gate
        uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65
        with:
          args: >-
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
